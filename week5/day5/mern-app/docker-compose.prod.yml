services:
  backend:
    build: ./server
    environment:
      - ATLAS_URI=mongodb://mongo:27017/employees
      - PORT=5000
    volumes:
      - ./server:/app
    ports:
      - "5000:5000"   # Backend exposed on host port 5000
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  frontend:
    build: ./client
    depends_on:
      - backend
    ports:
      - "8080:80"      # Map frontend container port 80 to host 8080
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  reverse-proxy:
    image: jwilder/nginx-proxy
    ports:
      - "81:80"       # Only the reverse-proxy binds to host port 80
      - "443:443"     # HTTPS
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - app-network

  nginx-letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    environment:
      NGINX_PROXY_CONTAINER: reverse-proxy
      NGINX_HOST: ${NGINX_HOST}
      NGINX_EMAIL: ${NGINX_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - reverse-proxy
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge