version: "3.9"

services:

  server-1:
    build: ./backend
    container_name: server1

  server-2:
    build: ./backend
    container_name: server2
    
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports: 
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-1
      - server-2
  

